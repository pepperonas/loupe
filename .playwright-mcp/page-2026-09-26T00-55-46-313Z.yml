            - code [ref=e173]: 13cc645893ae5b7951c282d6169fc30d036958cf012583f45b71e0430371aff4
        - paragraph [ref=e174]: Loupe is ad-hoc signed, not notarized — there is no Apple Team ID to check. Compare the SHA-256 of your download with the value above; the release on GitHub lists the same checksum.
