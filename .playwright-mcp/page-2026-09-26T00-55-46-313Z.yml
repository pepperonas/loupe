    - region [ref=e63]:
      - heading "What Loupe does" [level=2] [ref=e64]
      - generic [ref=e65]:
        - article [ref=e66]:
          - heading "JSON you can read" [level=3] [ref=e67]
          - paragraph [ref=e68]: A collapsible tree with counts and a peek at each object. A broken file shows the exact line and column, with the offending spot marked.
        - article [ref=e69]:
          - heading "Markdown, rendered" [level=3] [ref=e70]
          - paragraph [ref=e71]: Headings, tables, task lists and highlighted code blocks. Remote images stay blocked, so a preview never phones home.
        - article [ref=e72]:
          - heading "Logs at a glance" [level=3] [ref=e73]
          - paragraph [ref=e74]: Time, level, source and message in columns; seven formats, from nginx to JSON Lines. Big logs are read from the end, where the news is.
        - article [ref=e75]:
          - heading "Code in 20+ languages" [level=3] [ref=e76]
          - paragraph [ref=e77]: Swift, Python, Go, Rust, SQL, YAML and more, plus PowerShell, Batch and 13 XML dialects that macOS would otherwise never show.
        - article [ref=e78]:
          - heading "You decide" [level=3] [ref=e79]
          - paragraph [ref=e80]: Switch Loupe off globally or per category — Markdown, JSON, tables, logs, code. Off means plain text, exactly as without Loupe.
        - article [ref=e81]:
          - heading "Private and fast" [level=3] [ref=e82]
          - paragraph [ref=e83]: Sandboxed, read-only, offline, and not a single byte of JavaScript in a preview. Light and dark mode, English and German.
