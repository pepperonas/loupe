    - region [ref=f1e58]:
      - heading "What Loupe does" [level=2] [ref=f1e59]
      - generic [ref=f1e60]:
        - article [ref=f1e61]:
          - heading "JSON you can read" [level=3] [ref=f1e62]
          - paragraph [ref=f1e63]: A collapsible tree with counts and a peek at each object. A broken file shows the exact line and column, with the offending spot marked.
        - article [ref=f1e64]:
          - heading "Markdown, rendered" [level=3] [ref=f1e65]
          - paragraph [ref=f1e66]: Headings, tables, task lists and highlighted code blocks. Remote images stay blocked, so a preview never phones home.
        - article [ref=f1e67]:
          - heading "Logs at a glance" [level=3] [ref=f1e68]
          - paragraph [ref=f1e69]: Time, level, source and message in columns; seven formats, from nginx to JSON Lines. Big logs are read from the end, where the news is.
        - article [ref=f1e70]:
          - heading "Code in 20+ languages" [level=3] [ref=f1e71]
          - paragraph [ref=f1e72]: Swift, Python, Go, Rust, SQL, YAML and more, plus PowerShell, Batch and 13 XML dialects that macOS would otherwise never show.
        - article [ref=f1e73]:
          - heading "You decide" [level=3] [ref=f1e74]
          - paragraph [ref=f1e75]: Switch Loupe off globally or per category — Markdown, JSON, tables, logs, code. Off means plain text, exactly as without Loupe.
        - article [ref=f1e76]:
          - heading "Private and fast" [level=3] [ref=f1e77]
          - paragraph [ref=f1e78]: Sandboxed, read-only, offline, and not a single byte of JavaScript in a preview. Light and dark mode, English and German.
