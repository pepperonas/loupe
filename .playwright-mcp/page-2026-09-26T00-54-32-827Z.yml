          - definition [ref=f1e167]:
            - code [ref=f1e168]: 13cc645893ae5b7951c282d6169fc30d036958cf012583f45b71e0430371aff4
        - paragraph [ref=f1e169]: Loupe ist ad hoc signiert, nicht notarisiert – eine Apple-Team-ID zum Prüfen gibt es nicht. Vergleichen Sie die SHA-256 Ihres Downloads mit dem Wert oben; das Release auf GitHub nennt dieselbe Prüfsumme.
      - paragraph [ref=f1e170]:
        - text: Unter macOS 14 liegt der Schalter unter Datenschutz & Sicherheit → Erweiterungen → Quick Look. Bleibt es bei Rohtext? Einmal
