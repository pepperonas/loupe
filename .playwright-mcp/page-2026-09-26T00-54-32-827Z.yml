    - region [ref=f1e239]:
      - heading "Was Loupe kann" [level=2] [ref=f1e240]
      - generic [ref=f1e60]:
        - article [ref=f1e61]:
          - heading "JSON, das man lesen kann" [level=3] [ref=f1e241]
          - paragraph [ref=f1e63]: Ein aufklappbarer Baum mit Zählern und Vorschau je Objekt. Bei einer kaputten Datei stehen Zeile und Spalte da, die Stelle ist markiert.
        - article [ref=f1e64]:
          - heading "Markdown, gerendert" [level=3] [ref=f1e242]
          - paragraph [ref=f1e66]: Überschriften, Tabellen, Aufgabenlisten und hervorgehobene Codeblöcke. Externe Bilder bleiben blockiert – eine Vorschau telefoniert nie nach Hause.
        - article [ref=f1e67]:
          - heading "Logs auf einen Blick" [level=3] [ref=f1e243]
          - paragraph [ref=f1e69]: Zeit, Level, Quelle und Nachricht in Spalten; sieben Formate, von nginx bis JSON Lines. Große Logs werden vom Ende gelesen – dort steht das Neueste.
        - article [ref=f1e70]:
          - heading "Code in über 20 Sprachen" [level=3] [ref=f1e244]
          - paragraph [ref=f1e72]: Swift, Python, Go, Rust, SQL, YAML und mehr, dazu PowerShell, Batch und 13 XML-Dialekte, die macOS sonst nie zeigen würde.
        - article [ref=f1e73]:
          - heading "Sie entscheiden" [level=3] [ref=f1e245]
          - paragraph [ref=f1e75]: Loupe global oder je Rubrik abschalten – Markdown, JSON, Tabellen, Logs, Code. Aus heißt Rohtext, genau wie ohne Loupe.
        - article [ref=f1e76]:
          - heading "Privat und schnell" [level=3] [ref=f1e246]
          - paragraph [ref=f1e78]: Sandbox, nur lesend, offline und kein Byte JavaScript in einer Vorschau. Hell und dunkel, Deutsch und Englisch.
